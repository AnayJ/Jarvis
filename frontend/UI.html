<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Local Assets Fonts */
      @font-face {
        font-family: "AmericanCaptain";
        src: url("../assets/AmericanCaptain-MdEY.otf") format("opentype");
      }

      @font-face {
        font-family: "Avengero";
        src: url("../assets/AvengeroRegular-zvgl.ttf") format("truetype");
      }

      @font-face {
        font-family: "IronManOfWar2";
        src: url("../assets/IronManOfWar2Ncv-E85l.ttf") format("truetype");
      }

      .font-jarvis-logo {
        font-family: "AmericanCaptain", sans-serif;
        letter-spacing: 0.05em;
        color: #dbeaff;
      }

      .font-jarvis-ui {
        font-family: "AmericanCaptain", sans-serif;
        letter-spacing: 0.08em;
      }

      .font-avengero {
        font-family: "AmericanCaptain", sans-serif;
        color: #dbeaff;
      }

      /* Background Gradient */
      .bg-ironman-screen {
        position: relative;
        background-image:
          linear-gradient(180deg, rgba(0, 7, 17, 0.46) 0%, rgba(0, 8, 20, 0.28) 46%, rgba(0, 5, 14, 0.70) 100%),
          linear-gradient(90deg, rgba(0, 7, 17, 0.38) 0%, rgba(0, 8, 19, 0.10) 50%, rgba(0, 6, 16, 0.36) 100%),
          url("../assets/arc.jpg");
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        animation: hud-breathe 7s ease-in-out infinite;
        transform-origin: center;
      }

      .bg-ironman-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(90deg, rgba(4, 25, 49, 0.66) 0%, transparent 18%, transparent 82%, rgba(3, 16, 34, 0.58) 100%),
          linear-gradient(180deg, rgba(2, 7, 18, 0.36) 0%, transparent 18%, transparent 76%, rgba(1, 6, 16, 0.56) 100%);
        mix-blend-mode: multiply;
        opacity: 0.72;
      }

      .bg-ironman-screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 2, 8, 0.42) 100%);
      }

      /* Exact Figma Design Linear Gradient */
      .bg-input-gradient {
        background: linear-gradient(105deg, rgba(20, 32, 47, 0.84), rgba(9, 19, 31, 0.82));
        border: 1px solid rgba(196, 212, 231, 0.13);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.42),
          inset 0 -2px 4px rgba(0, 0, 0, 0.28),
          0 5px 14px rgba(0, 0, 0, 0.24);
      }

      @keyframes hud-breathe {
        0%, 100% {
          background-position: center center;
        }
        50% {
          background-position: center 1.2%;
        }
      }

      /* Custom Chat Scrollbar */
      #chat::-webkit-scrollbar {
        width: 6px;
      }
      #chat::-webkit-scrollbar-track {
        background: transparent;
      }
      #chat::-webkit-scrollbar-thumb {
        background: rgba(182, 215, 255, 0.35);
        border-radius: 9999px;
      }
      #chat::-webkit-scrollbar-thumb:hover {
        background: rgba(182, 215, 255, 0.6);
      }

      @keyframes message-pop {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      .animate-message {
        animation: message-pop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 28px;
        min-height: 100%;
        justify-content: flex-end;
      }

      .message-row {
        display: flex;
        width: 100%;
      }

      .message-row.user {
        justify-content: flex-end;
      }

      .message-row.jarvis {
        justify-content: flex-start;
      }

      .chat-bubble {
        border: 1px solid rgba(196, 212, 231, 0.12);
        border-radius: 11px;
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.34),
          inset 0 -2px 4px rgba(0, 0, 0, 0.28),
          0 7px 18px rgba(0, 0, 0, 0.22);
        font-family: "AmericanCaptain", sans-serif;
        line-height: 1.05;
      }

      .user-bubble {
        width: fit-content;
        max-width: min(34vw, 390px);
        min-width: clamp(54px, 11vw, 74px);
        padding: 10px 15px 9px;
        border-radius: 11px 4px 11px 11px;
        background: rgba(48, 61, 75, 0.78);
        color: #e2e5e9;
      }

      .jarvis-bubble {
        width: min(52.5vw, 610px);
        max-width: min(52.5vw, 610px);
        padding: 10px 15px 9px;
        border-radius: 4px 11px 11px 11px;
        background: rgba(67, 80, 89, 0.78);
        color: #e2e5e9;
      }

      .chat-text {
        margin: 0;
        font-size: clamp(18px, 3.2vw, 22px);
        letter-spacing: 0.035em;
        text-transform: uppercase;
      }

      .chat-time {
        display: none;
        margin-top: 7px;
        color: rgba(226, 229, 233, 0.68);
        font-family: "AmericanCaptain", sans-serif;
        font-size: 12px;
        letter-spacing: 0.06em;
      }

      .typing-bubble {
        display: flex;
        align-items: center;
        gap: 5px;
        min-height: 44px;
      }

      .typing-bubble span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #0b1a2d;
        animation: typing 1s infinite ease-in-out;
      }

      .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
      .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes typing {
        0%, 70%, 100% { transform: translateY(0); opacity: 0.35; }
        35% { transform: translateY(-5px); opacity: 1; }
      }

      @media (max-width: 700px) {
        .user-bubble,
        .jarvis-bubble {
          max-width: 82vw;
        }

        .chat-text {
          font-size: 16px;
        }
      }

      #heroText {
        margin-top: 55vh;
        position: relative;
        z-index: 12;
        max-width: min(90vw, 400px);
        padding: 16px 43px 15px;
        border: 1px solid rgba(207, 220, 234, 0.12);
        border-radius: 17px;
        background: rgba(12, 23, 36, 0.58);
        box-shadow:
          inset 0 2px 4px rgba(0, 0, 0, 0.42),
          inset 0 -2px 4px rgba(0, 0, 0, 0.3),
          0 8px 20px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(5px);
      }

      #heroText p {
        margin: 0;
        font-size: clamp(16px, 2.8vw, 22px);
        line-height: 1.1;
        letter-spacing: 0.04em;
        color: #d8d8d8;
      }

      .composer-footer {
        width: min(92vw, 1315px);
        max-width: 1315px;
        padding: 0 0 14px;
      }

      .send-btn {
        width: clamp(40px, 8.8vw, 60px);
        height: clamp(25px, 8.2vh, 36px);
        flex-basis: clamp(40px, 8.8vw, 60px);
        border: 1px solid rgba(0, 127, 169, 0.45);
        border-radius: 11px;
        background: rgba(8, 26, 40, 0.65);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.22);
      }

      .stop-btn {
        width: clamp(40px, 8.8vw, 60px);
        height: clamp(25px, 8.2vh, 36px);
        flex-basis: clamp(40px, 8.8vw, 60px);
        border: 1px solid rgba(132, 35, 40, 0.42);
        border-radius: 11px;
        background: rgba(25, 18, 27, 0.66);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.35), 0 4px 12px rgba(0, 0, 0, 0.22);
      }

      @media (max-width: 700px) {
        #chat {
          padding-left: 18px;
          padding-right: 18px;
        }

        #heroText {
          margin-top: 56vh;
        }
      }

      #chat {
        max-width: none;
        padding-left: clamp(18px, 4vw, 64px);
        padding-right: clamp(18px, 4vw, 64px);
        padding-top: clamp(48px, 13vh, 88px);
        padding-bottom: clamp(72px, 30vh, 128px);
      }

      #messages {
        gap: clamp(28px, 10vh, 44px);
        transform: translateY(-4vh);
      }

      @media (max-height: 500px) {
        #chat {
          padding-bottom: clamp(72px, 26vh, 110px);
        }
      }

      @media (max-width: 700px) {
        #chat {
          padding-right: clamp(42px, 10vw, 68px);
        }

        .composer-footer {
          padding-bottom: 23px;
        }
      }

      header.relative {
        padding-left: 24px;
        padding-right: 32px;
      }

      header h1.text-4xl {
        font-size: 52px;
        line-height: 1;
      }

      header .font-avengero {
        font-size: 17px;
        font-style: normal;
        color: #d0d0d0;
      }

      header > .flex {
        align-self: flex-start;
        margin-top: 4px;
      }

      footer.composer-footer {
        width: min(92vw, 1315px);
        padding: 0 16px 23px 0;
      }
    </style>
  </head>
  <body class="m-0 overflow-hidden select-none bg-ironman-screen h-screen w-screen text-white font-jarvis-ui">
    <div class="relative h-full w-full flex flex-col justify-between overflow-hidden">
      
      <!-- Top Header Bar -->
      <header class="relative z-30 flex items-center justify-between px-4 pt-4">
        <h1 class="text-4xl text-[#c7dcf7] font-jarvis-logo tracking-wider uppercase drop-shadow-[0_2px_4px_rgba(0,0,0,0.6)]">
          JARVIS
        </h1>
        <div class="flex items-center gap-3">
          <span class="w-2 h-2 rounded-full bg-[#d6b66f] shadow-[0_0_8px_#d6b66f]"></span>
          <span class="text-base tracking-wider text-[#d0d0d0] font-avengero uppercase">
            ONLINE
          </span>
        </div>
      </header>

      <!-- Central Arc Reactor Stage -->
      <div
        id="heroStage"
        class="absolute inset-0 z-10 flex flex-col items-center justify-center transition-all duration-700 ease-in-out pointer-events-none"
      >
        <div id="heroText" class="text-center transition-opacity duration-500 drop-shadow-[0_2px_6px_rgba(0,0,0,0.8)]">
          <p class="text-[#e2efff] text-3xl font-bold tracking-wider leading-none">
            HELLO, I AM JARVIS
          </p>
          <p class="text-[#e2efff] text-3xl font-bold tracking-wider leading-tight mt-1">
            WHAT CAN I DO FOR YOU TODAY?
          </p>
        </div>
      </div>

      <!-- Chat Bubble Container -->
      <main
        id="chat"
        class="relative z-20 flex-1 overflow-y-auto px-4 pt-28 pb-32 max-w-6xl mx-auto w-full"
      >
        <div id="messages"></div>
      </main>

      <!-- Input Bar Section -->
      <footer class="composer-footer relative z-30 w-full max-w-6xl mx-auto">
        <div class="flex items-center gap-2">
          <!-- Text Input Field using Figma Gradient -->
          <div class="flex-1 relative h-[35px] rounded-xl bg-input-gradient flex items-center">
            <input
              id="input"
              type="text"
              placeholder="TYPE A MESSAGE"
              autocomplete="off"
              class="w-full bg-transparent px-3 text-sm font-jarvis-ui tracking-wider text-[#e2e5e9] placeholder-[#c8cbd0]/75 focus:outline-none uppercase"
            />
          </div>

          <!-- Send Action Button -->
          <button
            id="sendBtn"
            onclick="send()"
            title="Send Message"
            class="send-btn transition-all flex items-center justify-center active:scale-95 hover:brightness-110"
          >
            <img
              src="../assets/send.png"
              alt="Send"
              class="w-6 h-6 object-contain filter invert drop-shadow"
            />
          </button>

          <!-- Stop / Cancel Action Button -->
          <button
            id="stopBtn"
            onclick="stopResponse()"
            title="Stop Response"
            class="stop-btn transition-all flex items-center justify-center active:scale-95 hover:brightness-110"
          >
            <img
              src="../assets/stop.png"
              alt="Stop"
              class="w-6 h-6 object-contain drop-shadow"
            />
          </button>
        </div>
      </footer>
    </div>

    <script>
      let controller = null;
      let hasStarted = false;

      function activateChatMode() {
        if (hasStarted) return;
        hasStarted = true;

        const stage = document.getElementById("heroStage");
        const text = document.getElementById("heroText");

        text.style.opacity = "0";
        stage.classList.remove("justify-center");
        stage.classList.add("justify-start", "pt-3");
      }

      function stopResponse() {
        if (controller) {
          controller.abort();
          controller = null;
        }
      }

      async function send(text = null) {
        const input = document.getElementById("input");
        const messages = document.getElementById("messages");
        const msg = (text || input.value).trim();
        if (!msg) return;

        activateChatMode();

        const userDiv = document.createElement("div");
        userDiv.className = "message-row user animate-message";
        userDiv.innerHTML = `
          <div class="chat-bubble user-bubble">
            <p class="chat-text">${escapeHtml(msg)}</p>
            <span class="chat-time">${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
          </div>
        `;
        messages.appendChild(userDiv);
        input.value = "";
        scrollToBottom();

        const typingDiv = document.createElement("div");
        typingDiv.className = "message-row jarvis animate-message";
        typingDiv.id = "typing";
        typingDiv.innerHTML = `
          <div class="chat-bubble jarvis-bubble typing-bubble">
            <span></span><span></span><span></span>
          </div>
        `;
        messages.appendChild(typingDiv);
        scrollToBottom();

        try {
          controller = new AbortController();
          const res = await fetch("http://127.0.0.1:8000/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg }),
            signal: controller.signal,
          });

          if (!res.ok) throw new Error(await res.text());

          typingDiv.remove();

          const botDiv = document.createElement("div");
          botDiv.className = "message-row jarvis animate-message";
          botDiv.innerHTML = `
            <div class="chat-bubble jarvis-bubble">
              <p class="chat-text response-text"></p>
              <span class="chat-time">${new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
            </div>
          `;
          messages.appendChild(botDiv);
          const botText = botDiv.querySelector(".response-text");

          const reader = res.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            botText.textContent += decoder.decode(value);
            scrollToBottom();
          }
        } catch (error) {
          const typing = document.getElementById("typing");
          if (typing) typing.remove();

          if (error.name === "AbortError") {
            const stopDiv = document.createElement("div");
            stopDiv.className = "message-row jarvis animate-message";
            stopDiv.innerHTML = `
              <div class="chat-bubble jarvis-bubble">
                <p class="chat-text">Operation Aborted</p>
              </div>
            `;
            messages.appendChild(stopDiv);
          }
        }
        scrollToBottom();
      }

      function scrollToBottom() {
        const chat = document.getElementById("chat");
        chat.scrollTop = chat.scrollHeight;
      }

      function escapeHtml(value) {
        const container = document.createElement("div");
        container.textContent = value;
        return container.innerHTML;
      }

      document.getElementById("input").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") stopResponse();
      });
    </script>
  </body>
</html>
